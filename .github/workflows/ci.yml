name: ci

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install core package
        run: python -m pip install -e .
      - name: Run validators, tests, fixtures, and table reproduction
        run: make check
      - name: Verify generated tracked artifacts are current
        run: git diff --exit-code
